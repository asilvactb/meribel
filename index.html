<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<meta name="robots" content="noindex,nofollow">
<title>Méribel 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="login" hidden>
  <svg class="peaks" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path class="p3" d="M0 360 L160 250 L260 300 L420 170 L560 280 L700 200 L860 300 L1000 150 L1160 270 L1300 210 L1440 290 V520 H0Z"/>
    <path class="p2" d="M0 420 L120 340 L250 390 L380 280 L520 380 L660 300 L820 400 L980 290 L1120 380 L1280 320 L1440 380 V520 H0Z"/>
    <path class="p1" d="M0 470 L180 410 L340 450 L520 380 L700 450 L880 400 L1060 460 L1240 410 L1440 450 V520 H0Z"/>
  </svg>
  <div class="snow" aria-hidden="true"></div>
  <div class="login-top">
    <span>Méribel 2027</span>
    <span class="hide-s">Les 3 Vallées · Savoie</span>
    <span>5 — 10 jan</span>
  </div>
  <div class="login-bottom">
    <h1 class="giant" aria-label="Vamos à neve">
      <span class="ln"><span>Vamos</span></span>
      <span class="ln acc"><span>à neve.</span></span>
    </h1>
    <form id="login-form" class="login-form" autocomplete="on">
      <p class="lf-title">Entrar</p>
      <select id="login-who" class="login-select" aria-label="Quem és" required></select>
      <div class="login-row">
        <input id="login-pass" type="password" required autocomplete="current-password" placeholder="Password">
        <button class="pill" type="submit">Entrar</button>
      </div>
      <p class="small muted" id="login-msg">Só para o grupo.</p>
    </form>
  </div>
</section>

<section id="denied" class="denied" hidden>
  <h2 class="display-s">Esta conta não faz parte da viagem.</h2>
  <p class="muted" id="denied-email"></p>
  <button class="pill ghost" id="denied-out" type="button">Sair</button>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="top" id="top">
    <a class="brand" href="#resumo" aria-label="Início"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m2.5 19 6.5-11 3.5 5.5 2.5-3.5 6.5 9z"/><path d="m7.2 11 1.8 1.6 1.6-1.4"/></svg></span><span>Méribel 2027</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <span id="me-name"></span>
      <button class="link" id="logout" type="button">Sair</button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="v-resumo" hidden></section>
    <section class="view" id="v-tratar" hidden></section>
    <section class="view" id="v-despesas" hidden></section>
    <section class="view" id="v-viagem" hidden></section>
    <section class="view" id="v-plano" hidden></section>
    <section class="view" id="v-mala" hidden></section>
    <section class="view" id="v-info" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-body"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
